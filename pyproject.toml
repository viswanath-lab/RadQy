[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radqy"
version = "0.1.0"
description = "RadQy command-line tool"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "pandas",
    "pydicom",
    "Pillow",
    "PyYAML",
    "argcomplete",  # optional: shell autocompletion for argparse CLI
    "questionary",  # optional: interactive segmenter picker
    "typer",        # CLI (pulls in click + rich)
    "click",
    "rich"
]

[project.scripts]
radqy = "backend.cli:main"


[tool.setuptools.packages.find]
include = ["backend"]

# Optional (install separately if you need them):
# - torch + monai: enable UNet/FCN segmenters under backend/seg/mri
